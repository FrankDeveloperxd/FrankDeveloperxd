<svg width="1280" height="260" viewBox="0 0 1280 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Full Stack delivery flow">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="260" rx="26" fill="#0B1220"/>
  <text x="640" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#94A3B8" letter-spacing="3">
    FROM INTERFACE TO DEPLOYMENT
  </text>

  <path id="route" d="M145 145 H1135" fill="none" stroke="#263449" stroke-width="4" stroke-linecap="round"/>
  <path d="M145 145 H1135" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-dasharray="65 925">
    <animate attributeName="stroke-dashoffset" values="0;-990" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <!-- moving packet -->
  <circle r="8" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="4.8s" repeatCount="indefinite">
      <mpath href="#route"/>
    </animateMotion>
  </circle>

  <!-- Nodes -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(145 145)">
      <circle r="45" fill="#101C30" stroke="#22D3EE" stroke-width="2"/>
      <text y="-3" font-size="24" font-weight="800" fill="#F8FAFC">&lt;/&gt;</text>
      <text y="74" font-size="16" font-weight="700" fill="#CBD5E1">Frontend</text>
    </g>

    <g transform="translate(390 145)">
      <circle r="45" fill="#101C30" stroke="#38BDF8" stroke-width="2"/>
      <text y="5" font-size="20" font-weight="800" fill="#F8FAFC">API</text>
      <text y="74" font-size="16" font-weight="700" fill="#CBD5E1">Backend</text>
    </g>

    <g transform="translate(640 145)">
      <circle r="45" fill="#101C30" stroke="#60A5FA" stroke-width="2"/>
      <ellipse cx="0" cy="-12" rx="20" ry="7" fill="none" stroke="#F8FAFC" stroke-width="3"/>
      <path d="M-20 -12V13C-20 22 20 22 20 13V-12" fill="none" stroke="#F8FAFC" stroke-width="3"/>
      <path d="M-20 1C-20 10 20 10 20 1" fill="none" stroke="#F8FAFC" stroke-width="3"/>
      <text y="74" font-size="16" font-weight="700" fill="#CBD5E1">Database</text>
    </g>

    <g transform="translate(890 145)">
      <circle r="45" fill="#101C30" stroke="#818CF8" stroke-width="2"/>
      <path d="M-24 -10H24V18H-24Z M-12 -22H12V-10H-12Z" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linejoin="round"/>
      <text y="74" font-size="16" font-weight="700" fill="#CBD5E1">Docker</text>
    </g>

    <g transform="translate(1135 145)">
      <circle r="45" fill="#101C30" stroke="#A78BFA" stroke-width="2"/>
      <path d="M-24 9H24 M-19 9V-16H19V9 M-9 -7H9" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
      <text y="74" font-size="16" font-weight="700" fill="#CBD5E1">VPS / Linux</text>
    </g>
  </g>
</svg>