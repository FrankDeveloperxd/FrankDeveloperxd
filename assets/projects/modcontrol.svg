<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="85" cy="70" r="9" fill="#ef4444"/>
  <circle cx="118" cy="70" r="9" fill="#f59e0b"/>
  <circle cx="151" cy="70" r="9" fill="#22c55e"/>

  <rect x="55" y="110" width="690" height="220" rx="20"
        fill="#0b1220" stroke="#334155"/>

  <text x="400" y="205" text-anchor="middle"
        font-family="monospace" font-size="62"
        font-weight="700" fill="url(#accent)">MQTT</text>

  <text x="400" y="265" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32" font-weight="800" fill="#f8fafc">MODCONTROL</text>

  <text x="400" y="302" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#94a3b8">IoT Monitoring System</text>

  <rect x="55" y="360" width="690" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>