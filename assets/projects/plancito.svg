<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PLANCITO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="478" rx="29" fill="none" stroke="#22D3EE" stroke-opacity=".20" stroke-width="2"/>

  <circle cx="70" cy="55" r="7" fill="#EF4444"/>
  <circle cx="94" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="118" cy="55" r="7" fill="#22C55E"/>

  <rect x="55" y="90" width="790" height="235" rx="22" fill="#0A1020" stroke="#22324A"/>
  <circle cx="450" cy="205" r="86" fill="url(#accent)" opacity=".12">
    <animate attributeName="r" values="80;92;80" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".10;.18;.10" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(450 205)" filter="url(#glow)">
    
          <rect x="-42" y="-34" width="84" height="72" rx="12" fill="none" stroke="#F8FAFC" stroke-width="5"/>
          <path d="M-42 -10H42 M-22 -45V-25 M22 -45V-25" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
          <circle cx="0" cy="12" r="8" fill="#F8FAFC"/>
          <path d="M0 20C-15 35-19 46-19 58C-19 69-10 78 0 78C10 78 19 69 19 58C19 46 15 35 0 20Z" fill="none" stroke="#F8FAFC" stroke-width="4" transform="scale(.55) translate(0 -10)"/>
        
  </g>

  <rect x="115" y="310" width="670" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="300;670;300" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;115;300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC">PLANCITO</text>
  <text x="450" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94A3B8">Event discovery &amp; management platform</text>
  <text x="450" y="440" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#22D3EE">Next.js · NestJS · PostgreSQL · Docker</text>
</svg>