<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AMBULANCE MONITOR">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="480" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="478" rx="29" fill="none" stroke="#38BDF8" stroke-opacity=".20" stroke-width="2"/>

  <circle cx="70" cy="55" r="7" fill="#EF4444"/>
  <circle cx="94" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="118" cy="55" r="7" fill="#22C55E"/>

  <rect x="55" y="90" width="790" height="235" rx="22" fill="#0A1020" stroke="#22324A"/>
  <circle cx="450" cy="205" r="86" fill="url(#accent)" opacity=".12">
    <animate attributeName="r" values="80;92;80" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".10;.18;.10" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(450 205)" filter="url(#glow)">
    
          <rect x="-48" y="-20" width="66" height="43" rx="8" fill="none" stroke="#F8FAFC" stroke-width="5"/>
          <path d="M18 -8H36L49 8V23H18Z" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="-27" cy="28" r="9" fill="#0B1220" stroke="#F8FAFC" stroke-width="5"/>
          <circle cx="31" cy="28" r="9" fill="#0B1220" stroke="#F8FAFC" stroke-width="5"/>
          <path d="M-25 -3H-5 M-15 -13V7" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
          <rect x="-38" y="-30" width="16" height="9" rx="3" fill="#F8FAFC"/>
        
  </g>

  <rect x="115" y="310" width="670" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="300;670;300" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;115;300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC">AMBULANCE MONITOR</text>
  <text x="450" y="404" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94A3B8">Real-time fleet monitoring platform</text>
  <text x="450" y="440" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#38BDF8">React · .NET · PostgreSQL · MQTT · WebSockets</text>
</svg>