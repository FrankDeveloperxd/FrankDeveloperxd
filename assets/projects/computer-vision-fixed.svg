<svg width="900" height="480" viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Computer Vision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="478" rx="29"
        fill="none" stroke="#F472B6" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Window controls -->
  <circle cx="70" cy="55" r="7" fill="#EF4444"/>
  <circle cx="94" cy="55" r="7" fill="#F59E0B"/>
  <circle cx="118" cy="55" r="7" fill="#22C55E"/>

  <!-- Preview panel -->
  <rect x="55" y="90" width="790" height="235" rx="22"
        fill="#0A1020" stroke="#22324A"/>

  <!-- Animated halo -->
  <circle cx="450" cy="205" r="84" fill="#8B5CF6" opacity="0.10">
    <animate attributeName="r" values="80;94;80" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Camera -->
  <g transform="translate(450 205)">
    <rect x="-58" y="-38" width="116" height="76" rx="15"
          fill="none" stroke="#F8FAFC" stroke-width="5"/>
    <circle cx="0" cy="0" r="22"
            fill="none" stroke="#F8FAFC" stroke-width="5"/>
    <circle cx="0" cy="0" r="6" fill="#F472B6"/>

    <!-- Detection corners -->
    <path d="M-42 -52H-18 M18 -52H42 M-42 52H-18 M18 52H42"
          fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

    <!-- Scan line: simple translate animation for broad SVG compatibility -->
    <line x1="-43" y1="-25" x2="43" y2="-25"
          stroke="#F472B6" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 50;0 0"
                        dur="2.8s"
                        repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Animated accent line -->
  <rect x="115" y="310" width="670" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="370" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="800" fill="#F8FAFC">
    COMPUTER VISION
  </text>

  <text x="450" y="404" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" fill="#94A3B8">
    Person detection and real-time validation
  </text>

  <text x="450" y="440" text-anchor="middle"
        font-family="monospace"
        font-size="16" font-weight="700" fill="#F472B6">
    Python · OpenCV · YOLOv5
  </text>
</svg>