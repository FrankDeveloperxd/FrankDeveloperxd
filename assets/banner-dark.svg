<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="28" fill="url(#grid)" opacity="0.55"/>

  <g opacity="0.22">
    <circle cx="90" cy="70" r="4" fill="#22d3ee">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="245" r="4" fill="#22d3ee">
      <animate attributeName="r" values="6;3;6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="260" font-family="monospace" font-size="42" fill="#22d3ee">&lt;/&gt;</text>
    <text x="1055" y="95" font-family="monospace" font-size="38" fill="#22d3ee">{ }</text>
  </g>

  <rect x="-360" y="0" width="360" height="330" fill="url(#line)" opacity="0.16">
    <animate attributeName="x" values="-360;1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="105" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="20"
        letter-spacing="7" fill="#22d3ee" font-weight="700">
    FULL STACK WEB DEVELOPER
  </text>

  <text x="600" y="170" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="49"
        fill="#f8fafc" font-weight="800">
    FRANK BERNAOLA
  </text>

  <g font-family="monospace" font-size="21" text-anchor="middle" fill="#94a3b8">
    <text x="600" y="220" opacity="1">
      React · Next.js · NestJS · PostgreSQL · Docker
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.50;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="220" opacity="0">
      Frontend · Backend · APIs · Databases · VPS
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.50;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <g filter="url(#glow)">
    <rect x="385" y="260" width="430" height="2" rx="1" fill="url(#line)">
      <animate attributeName="width" values="140;430;140" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="530;385;530" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="27.25"
        fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>